<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Author: Caleb Ader
     Date: 10/12/2026 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>

    <!-- Styles sheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Script sheet, Defer -->
    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">
        <!-- Title -->
        <h1>Movie Watchlist</h1>

        <!-- Form -->
        <form id="movie-form">
            <!-- Form title -->
            <label for="movie-title">Movie Title</label>
            <!-- Input movie title -->
            <input type="text" id="movie-title" placeholder="Enter movie title">

            <!-- Select movie genre -->
            <label for="movie-genre">Genre: </label>
            <select id="movie-genre">
                <option value="">Choose a genre</option>
                <option value="Action">Action</option>
                <option value="Adventure">Adventure</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Romance">Romance</option>
                <option value="Science Fiction">Science Fiction</option>
                <option value="Thriller">Thriller</option>
                <option value="Animation">Animation</option>
            </select>

            <!-- Submit button | Add movie to watchlist -->
            <button type="submit">Add Movie</button>

        </form>

        <!-- Form message -->
        <p id="form-message"></p>
        <!-- Movie that was added goes here -->
        <ul id="movie-list">

        </ul>

        <!-- Letting the user know if they have a movie in their watchlist or not -->
        <p id="empty-message">Your Watchlist is empty. Add a movie to get started.</p>

    </main>
    
</body>

</html>
